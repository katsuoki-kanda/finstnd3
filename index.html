<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Hand Gesture Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
        
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 40; pointer-events: none; text-shadow: 2px 2px 4px black; }
        .stat { font-size: 24px; margin-bottom: 10px; font-weight: bold; color: #00ff00; }
        
        #question-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 40px;
            z-index: 10;
            width: 90vw;
            justify-content: center;
        }

        .question-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hand-label {
            font-size: 20px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .q-img { 
            max-width: 40vw; 
            max-height: 60vh; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); 
            border-radius: 15px; 
            border: 4px solid #fff;
            transition: all 0.1s;
        }

        .q-img.correct {
            border: 8px solid #ff0000 !important;
            box-shadow: 0 0 40px #ff0000 !important;
            transform: scale(1.05);
        }

        #message { 
            position: absolute; 
            bottom: 10%; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 60px; 
            color: #ffff00; 
            text-align: center; 
            z-index: 50; 
            text-shadow: 3px 3px 0 #000; 
            font-weight: bold;
            width: 100%;
        }

        #start-btn { 
            position: absolute; 
            top: 70%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            padding: 20px 40px; 
            font-size: 28px; 
            cursor: pointer; 
            pointer-events: auto; 
            z-index: 60; 
            border-radius: 50px; 
            background: #00ff00; 
            border: 2px solid #fff; 
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <video id="input_video" style="display:none"></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="ui-layer">
        <div class="stat">Score: <span id="score">0</span></div>
        <div class="stat">Time: <span id="timer">45</span></div>
    </div>

    <div id="question-container">
        <div class="question-wrapper">
            <div class="hand-label">左手</div>
            <img id="img-right" class="q-img" src="0b.jpg">
        </div>
        <div class="question-wrapper">
            <div class="hand-label">右手</div>
            <img id="img-left" class="q-img" src="0.jpg">
        </div>
    </div>

    <div id="message">カメラ起動中...</div>
    <button id="start-btn" onclick="startGameManual()">ゲーム開始</button>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const scoreEl = document.getElementById('score');
    const timerEl = document.getElementById('timer');
    const imgRightEl = document.getElementById('img-right');
    const imgLeftEl = document.getElementById('img-left');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('start-btn');

    let score = 0;
    let timeLeft = 45;
    let gameStarted = false;
    let currentTargetRight = 0;
    let currentTargetLeft = 0;
    let lastTargetKey = ""; 
    let gameTimerInterval;
    let isCameraReady = false;
    let isTransitioning = false; // 次の問題への切り替え中フラグ

    const speech = window.speechSynthesis;
    function speak(text) {
        if (speech.speaking) { speech.cancel(); }
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'ja-JP';
        speech.speak(uttr);
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep() {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(900, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1);
    }

    function startGameManual() {
        if (gameStarted || !isCameraReady) return;
        startBtn.style.display = 'none';
        messageEl.innerText = "";
        score = 0;
        scoreEl.innerText = score;
        timeLeft = 45;
        timerEl.innerText = timeLeft;
        gameStarted = true;
        isTransitioning = false;
        lastTargetKey = "";
        nextQuestion();
        speak("スタート");
        
        clearInterval(gameTimerInterval);
        gameTimerInterval = setInterval(() => {
            timeLeft--;
            timerEl.innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function nextQuestion() {
        let r, l, key;
        do {
            r = Math.floor(Math.random() * 10) + 1;
            l = Math.floor(Math.random() * 10) + 1;
            key = `${r}-${l}`;
        } while (key === lastTargetKey);

        currentTargetRight = r;
        currentTargetLeft = l;
        lastTargetKey = key;

        imgRightEl.src = `${r}.jpg`;
        imgLeftEl.src = `${l}b.jpg`;
        
        imgRightEl.classList.remove('correct');
        imgLeftEl.classList.remove('correct');
        isTransitioning = false; // フラグをリセット
    }

    function endGame() {
        gameStarted = false;
        clearInterval(gameTimerInterval);
        imgRightEl.src = "0b.jpg";
        imgLeftEl.src = "0.jpg";
        imgRightEl.classList.remove('correct');
        imgLeftEl.classList.remove('correct');
        messageEl.innerHTML = `終了！<br>スコア: ${score}点`;
        speak(`${score}点です。終了。`);
        startBtn.style.display = 'block';
        startBtn.innerText = "もう一度プレイ";
    }

    function onResults(results) {
        if (!isCameraReady && results.image) {
            isCameraReady = true;
            messageEl.innerText = "両手を挙げてスタート！";
            startBtn.style.display = 'block';
        }

        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.scale(-1, 1);
        canvasCtx.drawImage(results.image, -canvasElement.width, 0, canvasElement.width, canvasElement.height);

        let rightHandOk = false;
        let leftHandOk = false;
        let startGestureCount = 0;

        // 次の問題への切り替え中ではない時だけ、一旦枠をリセット
        if (gameStarted && !isTransitioning) {
            imgRightEl.classList.remove('correct');
            imgLeftEl.classList.remove('correct');
        }

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            results.multiHandLandmarks.forEach((landmarks, index) => {
                const label = results.multiHandedness[index].label; 
                
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: (label==='Right'?'#00FF00':'#00FFFF'), lineWidth: 4});
                drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 2, radius: 3});

                const handSize = Math.hypot(landmarks[0].x - landmarks[9].x, landmarks[0].y - landmarks[9].y);
                const threshold = handSize * 0.12; 

                let f1 = 0;
                const thumbXdiff = landmarks[4].x - landmarks[3].x;
                if (label === 'Left') {
                    f1 = thumbXdiff > (threshold * 0.4) ? 1 : 0;
                } else {
                    f1 = thumbXdiff < -(threshold * 0.4) ? 1 : 0;
                }
                const f2 = (landmarks[6].y - landmarks[8].y) > threshold ? 1 : 0;
                const f3 = (landmarks[10].y - landmarks[12].y) > threshold ? 1 : 0;
                const f4 = (landmarks[14].y - landmarks[16].y) > threshold ? 1 : 0;
                const f5 = (landmarks[18].y - landmarks[20].y) > threshold ? 1 : 0;

                let detectedNum = -1;
                if (f1==0 && f2==1 && f3==0 && f4==0 && f5==0) detectedNum = 1;
                else if (f1==0 && f2==1 && f3==1 && f4==0 && f5==0) detectedNum = 2;
                else if (f1==0 && f2==1 && f3==1 && f4==1 && f5==0) detectedNum = 3;
                else if (f1==0 && f2==1 && f3==1 && f4==1 && f5==1) detectedNum = 4;
                else if (f1==1 && f2==1 && f3==1 && f4==1 && f5==1) detectedNum = 5;
                else if (f1==1 && f2==0 && f3==0 && f4==0 && f5==0) detectedNum = 6;
                else if (f1==1 && f2==1 && f3==0 && f4==0 && f5==0) detectedNum = 7;
                else if (f1==1 && f2==1 && f3==1 && f4==0 && f5==0) detectedNum = 8;
                else if (f1==0 && f2==0 && f3==1 && f4==1 && f5==1) detectedNum = 9;
                else if (f1==0 && f2==1 && f3==0 && f4==0 && f5==1) detectedNum = 10;

                if (!gameStarted && landmarks[0].y < 0.3) {
                    startGestureCount++;
                }

                if (gameStarted) {
                    // 物理右手 (label: Left)
                    if (label === 'Left' && detectedNum === currentTargetLeft) {
                        leftHandOk = true;
                        imgLeftEl.classList.add('correct');
                    }
                    // 物理左手 (label: Right)
                    if (label === 'Right' && detectedNum === currentTargetRight) {
                        rightHandOk = true;
                        imgRightEl.classList.add('correct');
                    }
                }
            });
        }

        if (!gameStarted && isCameraReady && startGestureCount >= 2) {
            startGameManual();
        }

        // 両手正解時の処理（切り替え中でない時のみ実行）
        if (gameStarted && !isTransitioning && rightHandOk && leftHandOk) {
            isTransitioning = true; // 即座にフラグを立てて重複処理を防ぐ
            score++;
            scoreEl.innerText = score;
            beep();
            messageEl.innerText = "PERFECT!";
            
            // 0.3秒間、赤枠が表示された状態をキープしてから次の問題へ
            setTimeout(() => { 
                if(gameStarted) {
                    messageEl.innerText = "";
                    nextQuestion(); 
                }
            }, 300);
        }

        canvasCtx.restore();
    }

    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 640,
        height: 480
    });
    camera.start();
</script>

</body>
</html>
